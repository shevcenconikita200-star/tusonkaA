<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>Сообщения</title>
<style>
:root{color-scheme:light;--bg:#f7f8fc;--surface:#fff;--text:#191c20;--muted:#5f6368;--line:#e2e5eb;--out:#d3e3fd;--in:#f0f1f5;--blue:#0b57d0;--blueText:#0842a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Roboto,"Google Sans",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;max-width:680px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;min-height:64px;display:flex;align-items:center;padding:0 16px;gap:16px;background:var(--bg);position:relative;z-index:3}
.topbar h1{font-size:22px;font-weight:500;letter-spacing:0;margin:0;flex:1}
.icon{border:0;background:transparent;color:var(--text);width:40px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;flex-shrink:0}
.icon:active{background:#e7eaf1}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:#d9e2f9;color:#284777;font-size:19px;font-weight:500}
.avatar.dad{background:#d7eadb;color:#285b3a}
.main{flex:1;min-height:0;overflow:auto}
.list-head{padding:8px 20px 12px}
.searchbox{height:48px;border-radius:28px;background:#e9edf6;display:flex;align-items:center;gap:12px;padding:0 16px;color:#44474e}
.searchbox svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.searchbox input{border:0;outline:0;background:transparent;color:var(--text);min-width:0;width:100%;font-size:16px}
.searchbox input::placeholder{color:#45474f}
.category{font-size:14px;color:var(--muted);padding:12px 20px 7px}
.contact{border:0;width:100%;padding:12px 20px;display:flex;align-items:center;gap:16px;background:transparent;color:inherit;text-align:left;min-height:76px}
.contact:active{background:#e9edf6}
.contact-info{min-width:0;flex:1;border-bottom:1px solid var(--line);height:56px;display:flex;justify-content:center;flex-direction:column;gap:5px}
.contact:last-child .contact-info{border-bottom:0}
.contact-row{display:flex;align-items:center;gap:12px}
.contact-name{font-size:16px;font-weight:500;flex:1}
.contact-time{font-size:12px;color:var(--muted)}
.preview{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;right:22px;bottom:24px;width:58px;height:58px;border:0;border-radius:18px;background:#d3e3fd;color:#174ea6;display:grid;place-items:center;box-shadow:0 2px 5px #0002;z-index:2}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chatbar{gap:8px;padding:0 8px}
.chatbar .icon{width:40px}
.chat-person{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.chat-person .avatar{width:40px;height:40px;flex-basis:40px}
.chat-person h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-person p{font-size:12px;color:var(--muted);margin:2px 0 0}
.chat-main{flex:1;min-height:0;display:flex;flex-direction:column}
.messages{flex:1;min-height:0;overflow:auto;padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px}
.date{align-self:center;color:var(--muted);font-size:12px;margin:8px 0 12px}
.msg{max-width:min(82%,420px);display:flex;flex-direction:column;gap:3px}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start;align-items:flex-start}
.bubble{padding:11px 16px;font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:22px}
.out .bubble{background:var(--out);border-bottom-right-radius:6px;color:#001d35}
.in .bubble{background:var(--in);border-bottom-left-radius:6px;color:var(--text)}
.meta{font-size:11px;color:var(--muted);padding:0 5px}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:30px}
.composer-wrap{padding:8px 12px max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.composer{display:flex;align-items:flex-end;gap:6px}
.composer-tools{height:48px;width:42px;flex:0 0 42px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#45474f}
.composer-tools svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input-shell{flex:1;min-width:0;min-height:48px;border:1px solid #747982;border-radius:26px;display:flex;align-items:flex-end;padding:5px 7px 5px 16px;gap:4px;background:var(--bg)}
.input-shell textarea{border:0;outline:0;resize:none;min-width:0;flex:1;background:transparent;color:var(--text);font-size:16px;line-height:22px;padding:7px 0;max-height:120px}
.input-shell textarea::placeholder{color:#5f6368}
.send{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#d3e3fd;color:#174ea6;display:grid;place-items:center}
.send svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.menu{display:none;position:absolute;right:12px;top:56px;z-index:10;min-width:220px;padding:8px 0;background:#fff;border-radius:8px;box-shadow:0 4px 18px #0003}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:13px 18px;color:#202124;font-size:14px}
.menu button:active{background:#edf1f8}
.toast{display:none;position:absolute;bottom:82px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:28px;background:#303134;color:#fff;font-size:14px;white-space:nowrap;z-index:20}
[hidden]{display:none!important}
@media(prefers-color-scheme:dark){
:root{color-scheme:dark;--bg:#131318;--surface:#1d1b20;--text:#e3e2e9;--muted:#c4c6d0;--line:#383940;--out:#004a77;--in:#2b2b31;--blue:#a8c7fa;--blueText:#d3e3fd}
.topbar{background:var(--bg)}
.searchbox{background:#303139;color:#e3e2e9}
.searchbox input{color:var(--text)}.searchbox input::placeholder{color:#c4c6d0}
.contact:active,.icon:active{background:#292a31}
.avatar{background:#35496b;color:#d3e3fd}.avatar.dad{background:#304d3a;color:#c5e8cc}
.fab{background:#394a66;color:#d3e3fd}
.out .bubble{color:#d3e3fd}.in .bubble{color:var(--text)}
.input-shell{border-color:#8a8c95}.input-shell textarea::placeholder{color:#c4c6d0}
.send{background:#394a66;color:#d3e3fd}
.menu{background:#2b2b31}.menu button{color:#e3e2e9}.menu button:active{background:#3a3b43}
}
@media(min-width:681px){body{background:#e4e7ed}.app{box-shadow:0 0 0 1px #d4d7de}}
</style>
</head>
<body>
<div class="app">
<header class="topbar" id="listTop">
  <h1>Сообщения</h1>
  <button class="icon" id="searchToggle" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg></button>
  <button class="icon" id="profileBtn" aria-label="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.2 20c.5-4 3-6 6.8-6s6.3 2 6.8 6"/></svg></button>
</header>
<header class="topbar chatbar" id="chatTop" hidden>
  <button class="icon" id="backBtn" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="chat-person"><div class="avatar" id="chatAvatar">М</div><div style="min-width:0"><h1 id="chatName">Мама</h1><p>Сообщения</p></div></div>
  <button class="icon" aria-label="Звонок" id="callBtn"><svg viewBox="0 0 24 24"><path d="M6.6 3.8 9.4 7l-1.8 2.3a14 14 0 0 0 7.1 7.1l2.3-1.8 3.2 2.8-.8 3c-.2.7-.9 1.1-1.6 1-8.6-1.2-14.4-7-15.6-15.6-.1-.7.3-1.4 1-1.6z"/></svg></button>
  <button class="icon" id="moreBtn" aria-label="Ещё"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></button>
  <div class="menu" id="menu">
    <button id="copyLast">Копировать последнее сообщение</button>
    <button id="clearChat">Удалить переписку</button>
  </div>
</header>
<main class="main" id="listView">
  <div class="list-head" id="searchArea" hidden><label class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg><input id="searchInput" placeholder="Поиск в сообщениях"></label></div>
  <div class="category">Недавние</div>
  <button class="contact" data-person="mom"><div class="avatar">М</div><div class="contact-info"><div class="contact-row"><span class="contact-name">Мама</span><span class="contact-time" id="momTime"></span></div><div class="preview" id="momPreview">Нажмите, чтобы начать переписку</div></div></button>
  <button class="contact" data-person="dad"><div class="avatar dad">П</div><div class="contact-info"><div class="contact-row"><span class="contact-name">Папа</span><span class="contact-time" id="dadTime"></span></div><div class="preview" id="dadPreview">Нажмите, чтобы начать переписку</div></div></button>
</main>
<button class="fab" id="newMessage" aria-label="Новое сообщение"><svg viewBox="0 0 24 24"><path d="M12 20H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="m8 15 8.8-8.8a2.1 2.1 0 0 1 3 3L11 18l-4 1z"/></svg></button>
<section class="chat-main" id="chatView" hidden>
  <div class="messages" id="messages"></div>
  <div class="composer-wrap"><form class="composer" id="composer">
    <button class="composer-tools" type="button" id="attachBtn" aria-label="Добавить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="input-shell"><textarea id="messageInput" rows="1" placeholder="Текстовое сообщение" aria-label="Текстовое сообщение"></textarea><button type="button" class="composer-tools" id="emojiBtn" aria-label="Эмодзи"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.4 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button></div>
    <button class="send" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="m3 20 18-8L3 4l3 8z"/><path d="M6 12h15"/></svg></button>
  </form></div>
</section>
<div class="toast" id="toast"></div>
</div>
<script>
(()=> {
const people={mom:{name:'Мама',initial:'М',cls:''},dad:{name:'Папа',initial:'П',cls:'dad'}};
const key='android-messages-prototype-v2';let data={};
try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
Object.keys(people).forEach(id=>{if(!Array.isArray(data[id]))data[id]=[]});
let active=null;
const $=id=>document.getElementById(id);
const clock=t=>new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}};
function last(id){return data[id].length?data[id][data[id].length-1]:null}
function updateList(){
Object.keys(people).forEach(id=>{let m=last(id);$(id+'Preview').textContent=m?m.text.replace(/\n/g,' '):'Нажмите, чтобы начать переписку';$(id+'Time').textContent=m?clock(m.time):''});
filterList();
}
function filterList(){
const q=$('searchInput').value.trim().toLowerCase();
document.querySelectorAll('.contact').forEach(b=>{let id=b.dataset.person;let m=last(id);b.hidden=!!q&&!(people[id].name.toLowerCase().includes(q)||(m&&m.text.toLowerCase().includes(q)))});
}
function openChat(id){
active=id;$('listView').hidden=true;$('newMessage').hidden=true;$('chatView').hidden=false;$('listTop').hidden=true;$('chatTop').hidden=false;
$('chatName').textContent=people[id].name;$('chatAvatar').textContent=people[id].initial;$('chatAvatar').className='avatar '+people[id].cls;
$('menu').style.display='none';render();$('messageInput').focus();
}
function back(){
active=null;$('chatView').hidden=true;$('chatTop').hidden=true;$('listTop').hidden=false;$('listView').hidden=false;$('newMessage').hidden=false;$('menu').style.display='none';updateList();
}
function render(){
const box=$('messages');box.replaceChildren();
const date=document.createElement('div');date.className='date';date.textContent='Сегодня';box.append(date);
if(!data[active].length){const e=document.createElement('div');e.className='empty';e.textContent='Нет сообщений';box.append(e)}
data[active].forEach(m=>{
const row=document.createElement('div');row.className='msg '+(m.from==='me'?'out':'in');
const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;
const meta=document.createElement('div');meta.className='meta';meta.textContent=clock(m.time)+(m.from==='me'?'  ✓✓':'');
row.append(bubble,meta);box.append(row);
});box.scrollTop=box.scrollHeight;
}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1800)}
document.querySelectorAll('.contact').forEach(b=>b.addEventListener('click',()=>openChat(b.dataset.person)));
$('backBtn').addEventListener('click',back);
$('newMessage').addEventListener('click',()=>{const choice=prompt('Кому написать? Введите «Мама» или «Папа»');if(!choice)return;const q=choice.trim().toLowerCase();if(q==='мама'||q==='м')openChat('mom');else if(q==='папа'||q==='п')openChat('dad');else toast('Выберите Мама или Папа')});
$('composer').addEventListener('submit',e=>{e.preventDefault();const text=$('messageInput').value.trim();if(!text||!active)return;data[active].push({from:'me',text,time:Date.now()});$('messageInput').value='';$('messageInput').style.height='auto';save();render();});
$('messageInput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('moreBtn').addEventListener('click',()=>$('menu').style.display=$('menu').style.display==='block'?'none':'block');
$('copyLast').addEventListener('click',async()=>{const m=last(active);$('menu').style.display='none';if(!m)return toast('Нет сообщений для копирования');try{await navigator.clipboard.writeText(m.text);toast('Сообщение скопировано')}catch(e){$('messageInput').value=m.text;$('messageInput').focus();toast('Текст вставлен в поле')}});
$('clearChat').addEventListener('click',()=>{ $('menu').style.display='none';if(confirm('Удалить переписку с '+people[active].name+'?')){data[active]=[];save();render();updateList()}});
$('searchToggle').addEventListener('click',()=>{$('searchArea').hidden=!$('searchArea').hidden;if(!$('searchArea').hidden)$('searchInput').focus();else{$('searchInput').value='';filterList()}});
$('searchInput').addEventListener('input',filterList);
$('profileBtn').addEventListener('click',()=>toast('Демо приложения «Сообщения»'));
$('callBtn').addEventListener('click',()=>toast('Звонки не подключены в HTML-прототипе'));
$('attachBtn').addEventListener('click',()=>toast('Вложения пока не подключены'));
$('emojiBtn').addEventListener('click',()=>{$('messageInput').value+='🙂';$('messageInput').focus()});
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#moreBtn'))$('menu').style.display='none'});
updateList();
})();
</script>
</body>
</html>
