<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Сообщения</title>
<style>
:root {
  color-scheme: dark;
  --bg: #131318;
  --surface: #1e1f25;
  --surface-2: #292a31;
  --incoming: #2b2d35;
  --outgoing: #334b68;
  --text: #e5e1e9;
  --muted: #c0c2cc;
  --accent: #a8c7fa;
  --line: #34363e;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: Roboto, "Google Sans", "Arial", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--bg); }
.topbar { min-height: 68px; padding: max(8px, env(safe-area-inset-top)) 16px 8px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar h1 { font-size: 23px; font-weight: 500; letter-spacing: -.3px; margin: 0; flex: 1; }
.icon-button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; display: inline-grid; place-items: center; font-size: 24px; color: var(--text); }
.icon-button:active { background: var(--surface-2); }
#settingsButton { font-size: 22px; }
.screen { display: none; flex: 1; min-height: 0; }
.screen.active { display: flex; flex-direction: column; }
.contact-list { overflow-y: auto; padding: 6px 8px 24px; }
.contact { display: flex; align-items: center; gap: 16px; padding: 12px 14px; width: 100%; border: 0; border-radius: 24px; background: transparent; text-align: left; min-height: 82px; }
.contact:active { background: #292a30; }
.avatar { width: 54px; height: 54px; flex: 0 0 54px; display: grid; place-items: center; border-radius: 50%; background: #b8c8dc; color: #233247; font-size: 22px; font-weight: 500; }
.avatar.dad { background: #d6b9dc; color: #412b49; }
.contact-body { min-width: 0; flex: 1; }
.contact-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.contact-name { font-size: 17px; font-weight: 500; }
.contact-time { font-size: 12px; color: var(--muted); white-space: nowrap; }
.contact-preview { display: block; color: var(--muted); font-size: 14px; margin-top: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chat-head { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.chat-head .avatar { width: 42px; height: 42px; flex-basis: 42px; font-size: 18px; }
.chat-head h1 { font-size: 19px; font-weight: 500; }
#backButton { font-size: 30px; font-weight: 300; }
.messages { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; overscroll-behavior: contain; }
.empty-note { color: var(--muted); text-align: center; font-size: 13px; margin: 20px 0; }
.message { max-width: 86%; width: fit-content; padding: 11px 15px 8px; border-radius: 20px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; line-height: 1.38; font-size: 15.5px; }
.message.incoming { align-self: flex-start; background: var(--incoming); border-bottom-left-radius: 5px; }
.message.outgoing { align-self: flex-end; background: var(--outgoing); border-bottom-right-radius: 5px; }
.message-time { display: block; text-align: right; font-size: 10px; color: #c8d0df; margin-top: 4px; }
.composer-wrap { flex-shrink: 0; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); background: var(--bg); }
.composer { display: flex; align-items: flex-end; gap: 8px; background: #292a31; border-radius: 28px; padding: 4px 5px 4px 18px; border: 1px solid #393b43; }
#messageInput { flex: 1; min-width: 0; max-height: 120px; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); padding: 11px 0; line-height: 1.4; font-size: 16px; }
#messageInput::placeholder { color: #c1c3cc; }
.send-button { width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 50%; background: var(--accent); color: #1a2637; font-size: 22px; display: grid; place-items: center; }
.send-button:active { filter: brightness(.9); }
.settings-content { overflow-y: auto; padding: 18px 16px 30px; }
.settings-content label { display: block; font-size: 15px; font-weight: 500; margin: 8px 0 9px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 18px; }
.settings-content textarea { width: 100%; min-height: 118px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); outline: none; line-height: 1.45; }
.settings-content textarea:focus, .settings-content input:focus { border-color: var(--accent); }
.settings-content input[type=number] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); outline: none; }
.button-row { display: flex; gap: 10px; margin-top: 22px; }
.action-button { border: 0; border-radius: 24px; padding: 13px 16px; font-weight: 500; flex: 1; }
.primary { background: var(--accent); color: #172536; }
.secondary { background: var(--surface-2); color: var(--text); }
.status { min-height: 22px; color: var(--accent); font-size: 13px; margin-top: 12px; }
@media (min-width: 600px) { #app { border-left: 1px solid #24252a; border-right: 1px solid #24252a; } .messages { padding-left: 22px; padding-right: 22px; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="mainHeader">
    <h1 id="headerTitle">Сообщения</h1>
    <button class="icon-button" id="settingsButton" aria-label="Настройки ответов" title="Настройки ответов">⚙</button>
  </header>

  <section class="screen active" id="homeScreen" aria-label="Список чатов">
    <div class="contact-list" id="contactList"></div>
  </section>

  <section class="screen" id="chatScreen" aria-label="Переписка">
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="composer-wrap">
      <form class="composer" id="messageForm">
        <textarea id="messageInput" rows="1" placeholder="Сообщение" aria-label="Сообщение"></textarea>
        <button class="send-button" type="submit" aria-label="Отправить сообщение" title="Отправить">➤</button>
      </form>
    </div>
  </section>

  <section class="screen" id="settingsScreen" aria-label="Настройки ответов">
    <div class="settings-content">
      <p class="hint">Настройте отдельный шаблон для каждого чата. Каждое вхождение <code>{message}</code> заменяется полным текстом отправленного сообщения.</p>
      <label for="momTemplate">Ответ мамы</label>
      <textarea id="momTemplate" spellcheck="false"></textarea>
      <label for="dadTemplate">Ответ папы</label>
      <textarea id="dadTemplate" spellcheck="false"></textarea>
      <label for="replyDelay">Задержка ответа (мс)</label>
      <input id="replyDelay" type="number" min="0" max="60000" step="1" inputmode="numeric">
      <p class="hint">Допустимый диапазон: от 0 до 60000 мс. Можно удалить все маркеры — тогда ответ будет отправлен без вставки исходного сообщения.</p>
      <div class="button-row">
        <button class="action-button primary" id="saveSettings" type="button">Сохранить настройки</button>
        <button class="action-button secondary" id="resetSettings" type="button">Сбросить настройки</button>
      </div>
      <div class="status" id="settingsStatus" role="status"></div>
    </div>
  </section>
</div>

<script>
'use strict';

/*
 * КОНФИГУРАЦИЯ ПО УМОЛЧАНИЮ
 * Меняйте текст ответа мамы и папы здесь. Маркер {message} будет заменён
 * на исходное сообщение; его можно повторять сколько угодно раз или удалить.
 * Задержка задаётся в миллисекундах: от 0 до 60000.
 * Настройки, сохранённые внутри приложения, имеют приоритет над этими значениями.
 */
const DEFAULT_SETTINGS = {
  replyTemplates: {
    mom: 'Привет! {message}. Я получила сообщение: {message}.',
    dad: 'Хорошо, твой текст: {message}. Повторяю ещё раз: {message}.'
  },
  replyDelay: 650
};

const STORAGE_KEYS = {
  settings: 'localMessages.settings.v1',
  chats: 'localMessages.chats.v1'
};
const CONTACTS = {
  mom: { name: 'Мама', initial: 'М', avatarClass: '' },
  dad: { name: 'Папа', initial: 'П', avatarClass: 'dad' }
};

function safeRead(key, fallback, validator) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return validator(parsed) ? parsed : fallback;
  } catch (_) {
    return fallback;
  }
}
function validSettings(value) {
  return !!value && typeof value === 'object' &&
    !!value.replyTemplates && typeof value.replyTemplates.mom === 'string' &&
    typeof value.replyTemplates.dad === 'string' &&
    Number.isFinite(Number(value.replyDelay)) &&
    Number(value.replyDelay) >= 0 && Number(value.replyDelay) <= 60000;
}
function validChats(value) {
  if (!value || typeof value !== 'object') return false;
  return ['mom', 'dad'].every(id => Array.isArray(value[id]) &&
    value[id].every(m => m && (m.sender === 'user' || m.sender === 'contact') &&
      typeof m.text === 'string' && typeof m.time === 'number' && Number.isFinite(m.time)));
}
function cloneDefaultSettings() {
  return {
    replyTemplates: { mom: DEFAULT_SETTINGS.replyTemplates.mom, dad: DEFAULT_SETTINGS.replyTemplates.dad },
    replyDelay: DEFAULT_SETTINGS.replyDelay
  };
}
let settings = safeRead(STORAGE_KEYS.settings, cloneDefaultSettings(), validSettings);
settings = {
  replyTemplates: { mom: settings.replyTemplates.mom, dad: settings.replyTemplates.dad },
  replyDelay: Math.max(0, Math.min(60000, Math.trunc(Number(settings.replyDelay))))
};
let chats = safeRead(STORAGE_KEYS.chats, { mom: [], dad: [] }, validChats);
let currentChat = null;
let currentScreen = 'home';

const $ = id => document.getElementById(id);
const homeScreen = $('homeScreen');
const chatScreen = $('chatScreen');
const settingsScreen = $('settingsScreen');
const headerTitle = $('headerTitle');
const settingsButton = $('settingsButton');
const contactList = $('contactList');
const messagesEl = $('messages');
const messageForm = $('messageForm');
const messageInput = $('messageInput');
const momTemplate = $('momTemplate');
const dadTemplate = $('dadTemplate');
const replyDelay = $('replyDelay');
const settingsStatus = $('settingsStatus');

function persistChats() {
  try { localStorage.setItem(STORAGE_KEYS.chats, JSON.stringify(chats)); } catch (_) {}
}
function persistSettings() {
  try { localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings)); } catch (_) {}
}
function formatTime(timestamp) {
  try {
    return new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit' }).format(new Date(timestamp));
  } catch (_) { return ''; }
}
function lastMessage(chatId) {
  const list = chats[chatId];
  return list.length ? list[list.length - 1] : null;
}
function makeElement(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}
function renderContacts() {
  contactList.replaceChildren();
  ['mom', 'dad'].forEach(id => {
    const contact = CONTACTS[id];
    const button = makeElement('button', 'contact');
    button.type = 'button';
    button.setAttribute('aria-label', 'Открыть чат: ' + contact.name);
    const avatar = makeElement('div', 'avatar ' + contact.avatarClass, contact.initial);
    avatar.setAttribute('aria-hidden', 'true');
    const body = makeElement('div', 'contact-body');
    const line = makeElement('div', 'contact-line');
    line.append(makeElement('span', 'contact-name', contact.name));
    const last = lastMessage(id);
    line.append(makeElement('span', 'contact-time', last ? formatTime(last.time) : ''));
    body.append(line);
    body.append(makeElement('span', 'contact-preview', last ? ((last.sender === 'user' ? 'Вы: ' : '') + last.text) : 'Нет сообщений'));
    button.append(avatar, body);
    button.addEventListener('click', () => openChat(id));
    contactList.append(button);
  });
}
function setScreen(screen) {
  currentScreen = screen;
  homeScreen.classList.toggle('active', screen === 'home');
  chatScreen.classList.toggle('active', screen === 'chat');
  settingsScreen.classList.toggle('active', screen === 'settings');
  settingsButton.style.display = screen === 'home' ? 'inline-grid' : 'none';
  const oldBack = $('backButton');
  if (oldBack) oldBack.remove();
  const title = $('headerTitle');
  if (screen === 'home') {
    title.textContent = 'Сообщения';
  } else if (screen === 'chat') {
    title.textContent = '';
    const back = makeElement('button', 'icon-button', '‹');
    back.id = 'backButton';
    back.type = 'button';
    back.setAttribute('aria-label', 'Назад к списку чатов');
    back.addEventListener('click', goHome);
    const head = makeElement('div', 'chat-head');
    const avatar = makeElement('div', 'avatar ' + CONTACTS[currentChat].avatarClass, CONTACTS[currentChat].initial);
    const name = makeElement('h1', '', CONTACTS[currentChat].name);
    head.append(avatar, name);
    const header = $('mainHeader');
    header.insertBefore(back, title);
    title.replaceWith(head);
    head.id = 'headerTitle';
  } else {
    title.textContent = 'Настройки ответов';
  }
}
function restoreHeaderTitle() {
  const current = $('headerTitle');
  if (current && current.tagName !== 'H1') {
    const h1 = makeElement('h1', '', '');
    h1.id = 'headerTitle';
    current.replaceWith(h1);
  }
}
function goHome() {
  currentChat = null;
  restoreHeaderTitle();
  setScreen('home');
  renderContacts();
}
function openChat(id) {
  currentChat = id;
  restoreHeaderTitle();
  setScreen('chat');
  renderMessages();
  messageInput.value = '';
}
function renderMessages() {
  messagesEl.replaceChildren();
  const list = chats[currentChat] || [];
  if (!list.length) messagesEl.append(makeElement('div', 'empty-note', 'Пока нет сообщений'));
  list.forEach(message => {
    const bubble = makeElement('div', 'message ' + (message.sender === 'user' ? 'outgoing' : 'incoming'));
    bubble.append(document.createTextNode(message.text));
    bubble.append(makeElement('span', 'message-time', formatTime(message.time)));
    messagesEl.append(bubble);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function sendMessage(text) {
  if (!currentChat || !text.trim()) return;
  const chatId = currentChat;
  // Сохраняем точный введённый текст, включая пробелы по краям, если они есть.
  const originalText = text;
  chats[chatId].push({ sender: 'user', text: originalText, time: Date.now() });
  persistChats();
  renderMessages();
  renderContacts();
  messageInput.value = '';
  messageInput.style.height = 'auto';

  // Шаблон и задержка фиксируются для этого сообщения: дальнейшее редактирование
  // настроек не меняет уже запланированный ответ.
  const templateSnapshot = settings.replyTemplates[chatId];
  const delaySnapshot = settings.replyDelay;
  const replyText = templateSnapshot.split('{message}').join(originalText);
  window.setTimeout(() => {
    chats[chatId].push({ sender: 'contact', text: replyText, time: Date.now() });
    persistChats();
    renderContacts();
    if (currentScreen === 'chat' && currentChat === chatId) renderMessages();
  }, delaySnapshot);
}
messageForm.addEventListener('submit', event => {
  event.preventDefault();
  sendMessage(messageInput.value);
});
messageInput.addEventListener('input', () => {
  messageInput.style.height = 'auto';
  messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
});
messageInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    messageForm.requestSubmit();
  }
});

settingsButton.addEventListener('click', () => {
  restoreHeaderTitle();
  setScreen('settings');
  momTemplate.value = settings.replyTemplates.mom;
  dadTemplate.value = settings.replyTemplates.dad;
  replyDelay.value = String(settings.replyDelay);
  settingsStatus.textContent = '';
});
$('saveSettings').addEventListener('click', () => {
  const rawDelay = replyDelay.value.trim();
  if (rawDelay === '' || !Number.isFinite(Number(rawDelay))) {
    settingsStatus.textContent = 'Введите задержку от 0 до 60000 мс.';
    return;
  }
  const delay = Math.trunc(Number(rawDelay));
  if (delay < 0 || delay > 60000) {
    settingsStatus.textContent = 'Задержка должна быть от 0 до 60000 мс.';
    return;
  }
  settings = {
    replyTemplates: { mom: momTemplate.value, dad: dadTemplate.value },
    replyDelay: delay
  };
  persistSettings();
  settingsStatus.textContent = 'Настройки сохранены.';
});
$('resetSettings').addEventListener('click', () => {
  settings = cloneDefaultSettings();
  persistSettings();
  momTemplate.value = settings.replyTemplates.mom;
  dadTemplate.value = settings.replyTemplates.dad;
  replyDelay.value = String(settings.replyDelay);
  settingsStatus.textContent = 'Настройки сброшены к значениям по умолчанию.';
});

// Корректное начальное состояние, в том числе при пустом или повреждённом localStorage.
renderContacts();
</script>
</body>
</html>
