
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project files
        run: |
          pwd
          find . -maxdepth 4 -type f | sort | head -200

      - name: Build APK
        run: |
          cd TushenkaAPK
          gradle assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soshenka-apk
          path: TushenkaAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
